services:
  - type: web
    name: pr-reviewer-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: .
    plan: free
    healthCheckPath: /health
    envVars:
      - key: NEO4J_URI
        sync: false
      - key: NEO4J_USER
        sync: false
      - key: NEO4J_PASSWORD
        sync: false
      - key: ENABLE_GRAPH_ENRICHMENT
        value: "false"
      - key: GRAPH_QUERY_TIMEOUT
        value: "5"
      - key: MAX_IMPACT_WARNINGS
        value: "10"
      - key: GITHUB_ACCESS_TOKEN
        sync: false
      - key: GITHUB_WEBHOOK_SECRET
        sync: false
      - key: DEFAULT_PROVIDER
        value: "huggingface"
      - key: DEFAULT_MODEL
        value: "moonshotai/Kimi-K2-Instruct"
      - key: HUGGING_FACE_API_KEY
        sync: false
      - key: HUGGING_FACE_API_URL
        value: "https://router.huggingface.co/v1"
      - key: REVIEW_BUG_MODEL
        value: "Qwen/Qwen2.5-Coder-32B-Instruct:nscale"
      - key: REVIEW_SECURITY_MODEL
        value: "Qwen/Qwen2.5-Coder-32B-Instruct:nscale"
      - key: REVIEW_CROSS_REPO_MODEL
        value: "meta-llama/Llama-3.3-70B-Instruct:groq"
      - key: REVIEW_SPECIALIST_TIMEOUT_SECONDS
        value: "120"
      - key: CORS_ORIGINS
        value: "https://pr-reviewer-web-gfa5.onrender.com"

  - type: web
    name: pr-reviewer-web
    runtime: docker
    dockerfilePath: ./frontend/Dockerfile
    dockerContext: .
    plan: free
    healthCheckPath: /
    envVars:
      - key: VITE_API_BASE_URL
        value: "https://pr-reviewer-api.onrender.com"
