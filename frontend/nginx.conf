server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Disable sendfile to prevent stale file serving in containerized environments
    sendfile off;

    location = /config.js {
        add_header Cache-Control "no-store";
        try_files $uri =404;
    }

    # Prevent browser from caching index.html so new asset hashes are always fetched
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
        try_files $uri =404;
    }

    # Long-term cache for hashed Vite assets (immutable because content-hash in filename)
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
